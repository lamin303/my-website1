<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>La Min & Myue</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#f7e8ef;font-family:Arial,"Noto Sans Myanmar",sans-serif}
body{display:flex;justify-content:center;align-items:center;min-height:100vh;overflow-x:hidden}
#openPage{width:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px}
.envelope{width:min(92vw,430px);aspect-ratio:1.45/1;position:relative;cursor:pointer;perspective:1000px;filter:drop-shadow(0 15px 25px rgba(90,50,65,.25))}
.env-body{position:absolute;inset:0;border-radius:14px;background:linear-gradient(145deg,#fff8fa,#eacbd5);overflow:hidden}
.env-body:before{content:"";position:absolute;inset:0;background:linear-gradient(35deg,transparent 49.7%,#dfb9c7 50%),linear-gradient(145deg,transparent 49.7%,#e5c3cf 50%);opacity:.9}
.flap{position:absolute;left:0;top:0;width:100%;height:62%;z-index:3;background:linear-gradient(160deg,#fffafb,#e6c4d0);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:50% 0;transition:transform 1s cubic-bezier(.2,.8,.2,1)}
.seal{position:absolute;z-index:5;left:50%;top:55%;transform:translate(-50%,-50%);width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:#b86d7f;color:#fff;border:4px solid #e8b7c3;box-shadow:0 6px 15px #8b526155;font-weight:bold;transition:.5s}
.label{position:absolute;z-index:6;left:50%;top:15%;transform:translateX(-50%);color:#965466;font-family:Georgia,serif;font-size:24px;white-space:nowrap}
.open .flap{transform:rotateX(180deg);z-index:1}
.open .seal{opacity:0;transform:translate(-50%,-50%) scale(.5)}
.hint{position:absolute;top:calc(100% + 12px);width:100%;text-align:center;color:#795764;font-size:14px}.subtitle{position:absolute;z-index:6;left:50%;top:29%;transform:translateX(-50%);width:100%;text-align:center;color:#795764;font-family:Georgia,serif;font-size:13px;white-space:nowrap}.heart{position:fixed;bottom:-35px;color:#d86d91;opacity:0;pointer-events:none;z-index:10;animation:floatHeart 5s linear infinite}@keyframes floatHeart{0%{transform:translateY(0) rotate(0deg) scale(.7);opacity:0}10%{opacity:.8}90%{opacity:.65}100%{transform:translateY(-110vh) rotate(25deg) scale(1.25);opacity:0}}
#invitePage{display:none;width:100%;background:#f7e8ef;min-height:100vh}
#invitePage.show{display:block;animation:fade .7s ease}
.invite-img{display:block;width:100%;height:auto;max-width:900px;margin:0 auto}
.back{display:block;margin:16px auto 28px;padding:10px 18px;border:0;border-radius:22px;background:#fff;color:#815564}
@keyframes fade{from{opacity:0;transform:translateY(25px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<section id="openPage">
  <div class="envelope" id="env">
    <div class="env-body"></div>
    <div class="flap"></div>
    <div class="label">La Min &amp; Myue</div>
    <div class="subtitle">Youre invited toour wedding!</div>
    <div class="seal">OPEN</div>
    <div class="hint">စာအိတ်ကိုနှိပ်ပြီးဖိတ်စာဖွင့်ပါ</div>
  </div>
  <div id="linkFallback" style="display:none;position:fixed;bottom:24px;left:16px;right:16px;text-align:center;z-index:20">
    <a href="https://canva.link/gpr1co8fchps063" target="_blank" rel="noopener"
       style="display:inline-block;padding:13px 22px;border-radius:24px;background:#b86d7f;color:white;text-decoration:none;font-weight:bold">
       ဖိတ်စာဖွင့်ရန် ဒီနေရာကိုနှိပ်ပါ ❤️
    </a>
  </div>
</section>



<script>
const env = document.getElementById('env');
const target = 'https://canva.link/gpr1co8fchps063';
let opened = false;

env.addEventListener('click', () => {
  if (opened) return;
  opened = true;
  env.classList.add('open');

  // Show a backup link in case the browser blocks automatic navigation.
  setTimeout(() => {
    document.getElementById('linkFallback').style.display = 'block';
    window.location.assign(target);
  }, 900);
});

// Floating animated hearts
const symbols = ['♥', '♡', '❤'];
function makeHeart() {
  const h = document.createElement('span');
  h.className = 'heart';
  h.textContent = symbols[Math.floor(Math.random() * symbols.length)];
  h.style.left = (Math.random() * 100) + 'vw';
  h.style.fontSize = (14 + Math.random() * 18) + 'px';
  h.style.animationDuration = (4 + Math.random() * 3) + 's';
  document.body.appendChild(h);
  setTimeout(() => h.remove(), 7500);
}
setInterval(makeHeart, 450);
</script>
</body>
</html>
